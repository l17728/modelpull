[project]
name = "dlw"
version = "0.1.0-alpha"
description = "modelpull controller — distributed HuggingFace model downloader"
authors = [{name = "modelpull contributors"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "boto3>=1.35,<2.0",
    "fastapi>=0.115,<0.116",
    "huggingface_hub>=0.26,<1.0",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "authlib>=1.3,<2.0",
    "pydantic>=2.9,<2.11",
    "pydantic-settings>=2.6,<2.7",
    "structlog>=24.4,<24.5",
    "httpx>=0.27,<0.28",
    "tenacity>=9.0,<10.0",
    "cryptography>=43,<44",
    "pyjwt[crypto]>=2.9,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "testcontainers[postgres]>=4.8,<5.0",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2.0",
    "moto[s3]>=5.0,<6.0",
]

[project.scripts]
dlw-executor = "dlw.executor.cli:main"
dlw-seed = "dlw.cli.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # pytest-asyncio 0.24 deprecates event_loop fixture override; we need it
    # for session-scoped async fixtures (testcontainer/local PG engine reuse).
    # See: https://github.com/pytest-dev/pytest-asyncio/issues/706
    "ignore::DeprecationWarning:pytest_asyncio",
]
addopts = "-v --tb=short --strict-markers -m 'not manual'"
markers = [
    "slow: marks tests requiring docker (testcontainers)",
    "manual: marks tests not run in CI; require external services (real HF / minio binary)",
]

[tool.coverage.run]
source = ["src/dlw"]
omit = ["*/alembic/*", "*/__init__.py"]

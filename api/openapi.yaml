openapi: 3.1.0
info:
  title: Distributed HF Downloader API
  version: 2.0.0
  description: |
    Distributed HuggingFace model weight downloader.

    Authentication:
      - User APIs: OIDC + Bearer JWT
      - Executor APIs: mTLS + Bearer JWT + HMAC body signature
      - Admin APIs: same as User APIs but require role=tenant_admin or system_admin

    Tenancy:
      - All resources are tenant-scoped except system-level admin endpoints
      - Header `X-Tenant-Slug` only honored for system_admin role

    Rate limits:
      - Per-route token bucket (see 02-protocol.md §8.1)

    Error format:
      - All errors: `{code, message, trace_id, details?}`

  contact:
    email: dlw@example.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: https://api.dlw.example.com/api/v2
    description: Production
  - url: https://staging-api.dlw.example.com/api/v2
    description: Staging
  - url: http://localhost:8000/api/v2
    description: Local dev

tags:
  - name: health
    description: Health and leader-election probes
  - name: tasks
    description: Download task management
  - name: subtasks
    description: File-level subtask operations
  - name: executors
    description: Executor lifecycle (called by executors only)
  - name: models
    description: HuggingFace model search and metadata
  - name: storage
    description: Storage backend management
  - name: tenants
    description: Tenant / project / user management
  - name: quota
    description: Quota and usage
  - name: audit
    description: Audit log access
  - name: admin
    description: System administration
  - name: auth
    description: OIDC authentication and session management
  - name: webhooks
    description: Webhook configuration
  - name: ai
    description: |
      AI Copilot — embedded chat interface backed by Claude/OpenCode in headless
      mode (v2.1). All write tool calls require explicit user confirmation.
      Detailed design: docs/v2.0/12-ai-copilot.md.

security:
  - bearerAuth: []

paths:
  # ========== Auth ==========
  /auth/login:
    get:
      tags: [auth]
      summary: Initiate OIDC login flow
      operationId: authLogin
      security: []
      description: Redirects the browser to the IdP authorization endpoint.
      responses:
        '307':
          description: Redirect to IdP (or dev-mode callback)
          headers:
            Location:
              schema: {type: string, format: uri}
              description: IdP authorization URL with state and nonce params

  /auth/callback:
    get:
      tags: [auth]
      summary: OIDC authorization code callback
      operationId: authCallback
      security: []
      description: |
        Handles the IdP redirect. Validates state cookie, exchanges code for
        tokens, resolves tenant via DLW_AUTH_TENANT_RULES_JSON, and returns a
        signed system-JWT.
      parameters:
        - in: query
          name: code
          required: true
          schema: {type: string}
          description: Authorization code from IdP
        - in: query
          name: state
          required: true
          schema: {type: string}
          description: CSRF state token (must match state cookie)
      responses:
        '200':
          description: Login successful — system-JWT issued
          content:
            application/json:
              schema:
                type: object
                required: [system_jwt, expires_in, tenant_id, role]
                properties:
                  system_jwt: {type: string}
                  expires_in: {type: integer, description: Seconds until JWT expires}
                  tenant_id: {type: integer, format: int64}
                  role: {type: string}
        '400':
          description: Invalid or missing state token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: IdP token validation failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: No tenant rule matched for this identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantUnresolved'}
        '503':
          description: IdP upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /auth/me:
    get:
      tags: [auth]
      summary: Return current identity and tenant context
      operationId: authMe
      description: Validates the bearer system-JWT and returns the caller's identity.
      responses:
        '200':
          description: Caller identity
          content:
            application/json:
              schema:
                type: object
                required: [user_id, tenant_id, role, project_ids, is_service]
                properties:
                  user_id: {type: integer, format: int64}
                  tenant_id: {type: integer, format: int64}
                  role: {type: string}
                  project_ids:
                    type: array
                    items: {type: integer, format: int64}
                  is_service: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  # ========== Tasks ==========
  /tasks:
    get:
      tags: [tasks]
      summary: List tasks
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: project_id
          schema: {type: integer, format: int64}
        - in: query
          name: created_after
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Paged tasks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: RBAC denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RbacDenied'}
        '429': {$ref: '#/components/responses/RateLimited'}

    post:
      tags: [tasks]
      summary: Create download task
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
            examples:
              minimal:
                summary: Minimal request
                value:
                  repo_id: deepseek-ai/DeepSeek-V3
                  revision: abc123def4567890abc123def4567890abc12345
              fullAutoBalance:
                summary: Auto-balance multi-source
                value:
                  repo_id: Qwen/Qwen3-72B-Instruct
                  revision: abc123def4567890abc123def4567890abc12345
                  storage_id: 5
                  priority: 2
                  source_strategy: auto_balance
                  file_filter: core_only
              upgrade:
                summary: Incremental upgrade
                value:
                  repo_id: Qwen/Qwen3-72B-Instruct
                  revision: 1234567890abcdef1234567890abcdef12345678
                  upgrade_from_revision: 0000000000fedcba0000000000fedcba00000000
                  storage_id: 5
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskCreatedResponse'}
              examples:
                created:
                  value:
                    id: 7e57a3f8-1234-4567-8901-abcdef012345
                    status: pending
                    trace_id: c0ffee0123456789
                    files_to_download: 163
                    estimated_bytes: 740088332288
                    speed_probe_eta_seconds: 8
        '400':
          description: Invalid request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidRevision:
                  value:
                    code: INVALID_REVISION
                    message: revision must be a 40-char git sha; 'main' / branches not allowed
                    trace_id: c0ffee0123456789
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: RBAC denied (RbacDenied) or gated model not approved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                code: REPO_GATED
                message: Repo requires approval; ticket created
                trace_id: c0ffee0123456789
                details:
                  approval_ticket_url: https://dlw.example.com/approvals/123
        '404':
          description: Repo not found or cross-tenant task ID (existence not leaked)
        '409':
          description: Duplicate task or idempotency replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                code: DUPLICATE_TASK
                message: Same (repo_id, revision) already in progress
                trace_id: c0ffee0123456789
                details:
                  existing_task_id: 7e57a3f8-1234-4567-8901-abcdef012345
        '429':
          description: Quota exceeded (QuotaExceeded) or rate limited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                code: QUOTA_EXCEEDED
                message: Tenant monthly bytes quota exceeded
                trace_id: c0ffee0123456789
                details:
                  metric: bytes_month
                  current: 12345678901234
                  limit: 10000000000000

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    get:
      tags: [tasks]
      summary: Get task by ID
      operationId: getTask
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTask'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: RBAC denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RbacDenied'}
        '404':
          description: Task not found or cross-tenant ID (existence not leaked)

    patch:
      tags: [tasks]
      summary: Update task (priority only)
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority: {type: integer, minimum: 0, maximum: 3}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTask'}

    delete:
      tags: [tasks]
      summary: Delete a terminal task (dereferences its storage objects)
      description: >
        Terminal-only (succeeded/failed/cancelled → else 409). Tenant-scoped
        and RBAC-gated. Dereferences each subtask's storage_objects row
        (refcount--); physical bytes are NOT deleted here — refcount=0 rows
        are reclaimed by the leader-gated GC past the grace window.
      operationId: deleteTask
      responses:
        '204':
          description: Task deleted; referenced storage_objects dereferenced
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: RBAC denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RbacDenied'}
        '404':
          description: Task not found or cross-tenant ID (existence not leaked)
        '409':
          description: Task is not terminal
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string, enum: [TASK_NOT_TERMINAL]}
                  status: {type: string}

  /tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: Cancel task (async)
      operationId: cancelTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 256}
      responses:
        '202':
          description: Cancelling
          content:
            application/json:
              schema:
                type: object
                required: [status, in_flight_subtasks]
                properties:
                  status: {type: string, const: cancelling}
                  in_flight_subtasks: {type: integer}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: RBAC denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RbacDenied'}
        '404':
          description: Task not found or cross-tenant ID (existence not leaked)

  /tasks/{taskId}/retry:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: Retry failed subtasks
      operationId: retrySubtasks
      parameters:
        - in: query
          name: subtask_ids
          schema:
            type: array
            items: {type: string, format: uuid}
            maxItems: 200
      responses:
        '204': {description: Accepted}

  /tasks/{taskId}/replan:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: Force adaptive download optimizer to replan (v2.1)
      description: |
        Force PlanOptimizer (13 §4.3) to evaluate this task immediately,
        bypassing periodic tick. Subject to per-user replan rate limit
        (6/h) and global cooldown.
      operationId: replanTask
      responses:
        '202':
          description: Replan triggered
          content:
            application/json:
              schema:
                type: object
                required: [decision_id, triggered_at]
                properties:
                  decision_id: {type: integer, format: int64}
                  triggered_at: {type: string, format: date-time}
                  expected_savings_seconds: {type: number, nullable: true}
        '429':
          description: Rate limited (per-user replan budget)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /tasks/{taskId}/upgrade:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: Upgrade to new revision (incremental)
      operationId: upgradeTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_revision]
              properties:
                to_revision: {type: string, pattern: '^[0-9a-f]{40}$'}
                keep_old_files_for_days: {type: integer, default: 7, minimum: 0, maximum: 365}
      responses:
        '201':
          description: New task created (linked to old)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskCreatedResponse'}

  /tasks/{taskId}/subtasks:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [subtasks]
      summary: List subtasks of a task
      operationId: listSubtasks
      parameters:
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/SubtaskStatus'}
      responses:
        '200':
          description: Subtasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/FileSubTask'}

  /tasks/{taskId}/source-allocation:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: View source allocation (multi-source visualization)
      operationId: getSourceAllocation
      responses:
        '200':
          description: Source allocation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceAllocation'}

  /tasks/{taskId}/source-allocation/stream:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Live source-allocation SSE stream (UI-SP5h)
      operationId: streamSourceAllocation
      responses:
        '200':
          description: SSE stream of SourceAllocation snapshots
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is `data: <SourceAllocation JSON>\n\n`
                  ({task_id, sources_used, chunk_level_routing}).
                  Stream terminates only on client disconnect or
                  shutdown.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404':
          description: Task not found (or not in caller's tenant)

  /tasks/{taskId}/events:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Task event log
      operationId: getTaskEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TaskEvent'}
                  next_cursor: {type: string, nullable: true}

  /tasks/{taskId}/events/stream:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Live task-events SSE stream (UI-SP5f)
      operationId: streamTaskEvents
      responses:
        '200':
          description: SSE stream of TaskEventsResponse snapshots
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is `data: <TaskEventsResponse JSON>\n\n`
                  ({items, next_cursor}). Live feed always pushes
                  page 1 (newest first); the client's "Load older"
                  button still uses the one-shot
                  /tasks/{taskId}/events?cursor=… endpoint. Stream
                  terminates only on client disconnect or shutdown.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404':
          description: Task not found (or not in caller's tenant)

  /tasks/stream:
    get:
      tags: [tasks]
      summary: Live tenant-scoped tasks-list SSE stream (UI-SP5c)
      operationId: streamTaskList
      responses:
        '200':
          description: SSE stream of TaskList snapshots (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is `data: <TaskList JSON>\n\n` ({items, total}).
                  Stream terminates only on client disconnect or controller
                  shutdown. Keep-alive comment lines (`:keepalive`) may appear.

  /tasks/{taskId}/stream:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Live TaskDetail SSE stream (UI-SP5)
      operationId: streamTaskDetail
      responses:
        '200':
          description: SSE stream of TaskDetail snapshots (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is `data: <TaskDetail JSON>\n\n`. Stream terminates
                  on terminal task status, client disconnect, or controller
                  shutdown. Keep-alive comment lines (`:keepalive`) may appear.

  /tasks/{taskId}/subtask-chunks:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Per-file chunk segments (download-manager visualization)
      operationId: getSubtaskChunks
      responses:
        '200':
          description: Subtask chunk report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubtaskChunkReport'}

  /tasks/{taskId}/subtask-chunks/stream:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Live subtask-chunks SSE stream (UI-SP5g)
      operationId: streamSubtaskChunks
      responses:
        '200':
          description: SSE stream of SubtaskChunkReport snapshots
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is `data: <SubtaskChunkReport JSON>\n\n`
                  ({items}). Stream terminates only on client
                  disconnect or shutdown.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404':
          description: Task not found (or not in caller's tenant)

  /tasks/{taskId}/participating-executors:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Executors participating in this task (swimlanes)
      operationId: getParticipatingExecutors
      responses:
        '200':
          description: Participating executors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipatingExecutors'}

  /tasks/{taskId}/participating-executors/stream:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Live participating-executors SSE stream (UI-SP5i)
      operationId: streamParticipatingExecutors
      responses:
        '200':
          description: SSE stream of ParticipatingExecutors snapshots
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is `data: <ParticipatingExecutors JSON>\n\n`
                  ({items}). Stream terminates only on client disconnect
                  or shutdown.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404':
          description: Task not found (or not in caller's tenant)

  # ========== Models ==========
  /models/search:
    get:
      tags: [models]
      summary: Search HuggingFace models
      operationId: searchModels
      parameters:
        - in: query
          name: query
          required: true
          schema: {type: string, maxLength: 200}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: pipeline_tag
          schema: {type: string}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ModelSummary'}
        '503':
          description: HF upstream degraded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /models/{repoId}/info:
    parameters:
      - in: path
        name: repoId
        required: true
        schema: {type: string}
        description: Format `org/model`
    get:
      tags: [models]
      summary: Get model info (file list, sha256, multi-source coverage)
      operationId: getModelInfo
      parameters:
        - in: query
          name: revision
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{40}$|^main$'}
      responses:
        '200':
          description: Model info
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelInfo'}

  # ========== Health ==========
  /health/active:
    get:
      tags: [health]
      summary: LB target — 200 iff this instance holds the leader advisory lock
      operationId: healthActive
      security: []
      responses:
        '200':
          description: Active or recovering — LB should route to this instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [active] }
                  controller_state: { type: string, enum: [recovering, active] }
        '503':
          description: Standby — LB must NOT route to this instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      controller_state: { type: string, enum: [standby] }

  # ========== Executors ==========
  /executors:
    get:
      tags: [executors]
      summary: List executors visible to the principal (UI-SP3)
      operationId: listExecutors
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [joining, healthy, degraded, suspect, faulty]
      responses:
        '200':
          description: Executors visible to the principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutorListResponse'}

  /executors/stream:
    get:
      tags: [executors]
      summary: Live executors-list SSE stream (UI-SP5b)
      operationId: streamExecutors
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [joining, healthy, degraded, suspect, faulty]
      responses:
        '200':
          description: SSE stream of ExecutorListResponse snapshots
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is `data: <ExecutorListResponse JSON>\n\n`. Stream
                  terminates only on client disconnect or controller shutdown.
                  Keep-alive comment lines (`:keepalive`) may appear.

  /executors/register:
    post:
      tags: [executors]
      summary: Register an executor (mTLS bootstrap)
      description: |
        Called once during executor startup. Requires enrollment_token (out-of-band).
        Returns mTLS client certificate and JWT.
      operationId: registerExecutor
      security: []
      parameters:
        - in: header
          name: X-Enrollment-Token
          required: true
          schema: {type: string}
          description: 256-bit hex enrollment secret
        - in: header
          name: X-Enrollment-Nonce
          required: true
          schema: {type: string}
          description: 128-bit random hex
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutorRegisterRequest'}
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutorRegisterResponse'}
        '401':
          description: Invalid enrollment token
        '409':
          description: Nonce replay or executor_id conflict

  /executors/heartbeat:
    post:
      tags: [executors]
      summary: Executor heartbeat
      operationId: postHeartbeat
      parameters:
        - in: header
          name: X-Executor-Epoch
          required: true
          schema:
            type: integer
            minimum: 1
          description: Fence token. Must match the executor's current epoch.
        - in: header
          name: X-Heartbeat-Nonce
          required: true
          schema: {type: string}
        - in: header
          name: X-Heartbeat-Timestamp
          required: true
          schema: {type: string, format: date-time}
        - in: header
          name: X-Heartbeat-HMAC
          required: true
          schema: {type: string}
        - in: header
          name: X-HMAC-Timestamp
          required: true
          schema: {type: integer}
          description: Unix epoch seconds; validated within ±5 min of server clock
        - in: header
          name: X-HMAC-Nonce
          required: true
          schema: {type: string}
          description: 128-bit random hex nonce; replay window enforced by server
        - in: header
          name: X-HMAC-Signature
          required: true
          schema: {type: string}
          description: HMAC-SHA256(hmac_seed_hex, body || X-HMAC-Timestamp || X-HMAC-Nonce)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HeartbeatRequest'}
            examples:
              healthyMidDownload:
                summary: Healthy executor mid-download (CODE-22 v2.0.16)
                value:
                  executor_id: host-12.local-worker-1
                  epoch: 14
                  host_id: host-12.local
                  parent_executor_id: null
                  timestamp: "2026-05-07T10:30:00.000Z"
                  uptime_seconds: 3600
                  system:
                    nic_speed_gbps: 10
                    nic_utilization_percent: 67
                    disk_total_gb: 2000
                    disk_free_gb: 1230
                    parts_dir_bytes: 12345678901
                    memory_used_percent: 34
                    load_avg_1min: 4.2
                    active_threads: 16
                    running_subtasks: 5
                  source_health:
                    huggingface: {reachable: true, rtt_ms: 320, last_5xx_ago_s: 1200}
                    modelscope: {reachable: true, rtt_ms: 18, last_5xx_ago_s: null}
                    hf_mirror: {reachable: true, rtt_ms: 35, last_5xx_ago_s: null}
                  tasks:
                    - subtask_id: 11111111-2222-3333-4444-555555555555
                      task_id: 7e57a3f8-1234-4567-8901-abcdef012345
                      executor_epoch: 14
                      assignment_token: 99999999-aaaa-bbbb-cccc-dddddddddddd
                      status: downloading
                      bytes_downloaded: 9876543210
                      bytes_total: 17000000000
                      chunks_total: 8
                      chunks_completed: 5
                      active_threads: 4
                      current_speed_bytes_per_sec: 950000000
                      speed_window_seconds: 5
                      eta_seconds: 75
                      source_id: modelscope
              withCompletion:
                summary: Heartbeat including a completed subtask
                value:
                  executor_id: host-12.local-worker-1
                  epoch: 14
                  host_id: host-12.local
                  timestamp: "2026-05-07T10:35:00.000Z"
                  uptime_seconds: 3900
                  system: {nic_speed_gbps: 10, nic_utilization_percent: 12, disk_free_gb: 1228, parts_dir_bytes: 0, memory_used_percent: 22, load_avg_1min: 0.5, active_threads: 0, running_subtasks: 0}
                  completed_subtasks:
                    - actual_sha256: abc123def4567890abc123def4567890abc123def4567890abc123def4567890
                      actual_size: 17000000000
                      remote_storage_uri: s3://prod-bucket/team-a/deepseek-ai/DeepSeek-V3/abc123/model-001-of-163.safetensors
                      remote_etag: '"d41d8cd98f00b204e9800998ecf8427e"'
                      remote_sha256_via_checksum: abc123def4567890abc123def4567890abc123def4567890abc123def4567890
                      duration_seconds: 1820
                      sources_used: [modelscope]
                      bytes_per_source: {modelscope: 17000000000}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeartbeatResponse'}
              examples:
                idle:
                  summary: No new work; executor stays idle
                  value:
                    server_timestamp: "2026-05-07T10:30:00.150Z"
                    epoch_check: ok
                    next_heartbeat_in_seconds: 10
                    config_version: 42
                    new_assignments: []
                    cancellations: []
                    reassignments: []
                withNewAssignment:
                  summary: Server pushes a new subtask assignment
                  value:
                    server_timestamp: "2026-05-07T10:30:00.150Z"
                    epoch_check: ok
                    next_heartbeat_in_seconds: 10
                    config_version: 42
                    new_assignments:
                      - subtask_id: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                        task_id: 7e57a3f8-1234-4567-8901-abcdef012345
                        filename: model-002-of-163.safetensors
                        expected_size: 4322000000
                        expected_sha256: ffffffff...
                        source_id: modelscope
                        alternate_sources: [hf_mirror, huggingface]
                        executor_epoch: 14
                        target_executor_epoch: 14
                        optimization_generation: 7
                        assignment_token: bbbbbbbb-cccc-dddd-eeee-ffffffffffff
                        deadline_at: "2026-05-07T11:00:00Z"
        '401':
          description: Epoch mismatch (stale executor) or bearer token invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          code:
                            type: string
                            enum: [EPOCH_MISMATCH]
                          expected:
                            type: integer
                          got:
                            type: integer
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example:
                type: https://docs.dlw.example.com/errors/epoch-mismatch
                title: Executor epoch outdated
                status: 401
                detail: "request.epoch=13 but current executors.epoch=14; executor must re-register"
                code: EPOCH_MISMATCH
                trace_id: c0ffee0123456789
        '409':
          description: CLOCK_SKEW or NONCE_REPLAY
        '429':
          description: Server requesting backoff
          headers:
            Retry-After: {schema: {type: integer}}
        '503':
          description: Controller is recovering after a failover (INVARIANT 33). Retry shortly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      code: { type: string, enum: [CONTROLLER_RECOVERING] }
                      message: { type: string }


  # ========== Reverse-channel WSS (v2.1) ==========
  # Note: WSS endpoints are not formally part of OpenAPI 3.1; documented inline here
  # See 14 §1.2 for full protocol.
  #
  # WSS /ws/v1/executor
  #   Subprotocol: bearer.<executor_jwt>
  #   Headers: same as REST mTLS
  #   Server pushes: {type: assign|cancel|abort|rebalance|renew_sts|drain, target_executor_epoch, ...}
  #   Client events: {type: progress|subtask_complete|rate_limit_probe_result|creds_change_pending|creds_change_committed}
  #   Heartbeat: ping/pong every 20s

  # ========== AI Copilot (v2.1) ==========
  /ai/chat:
    post:
      tags: [ai]
      summary: Chat with AI Copilot (streaming SSE)
      description: |
        Sends a user message to the AI Copilot. Response is server-sent events.
        Detailed protocol: docs/v2.0/12-ai-copilot.md §4.

        Event types streamed:
        - `assistant.thinking` — internal reasoning (optional display)
        - `assistant.message_delta` — final message chunk to user
        - `tool_call` — read-only tool invocation
        - `tool_call_pending_confirm` — write tool awaiting confirmation
        - `tool_result` — tool execution result
        - `tool_error` — tool failure
        - `quota_exceeded` — LLM token budget hit
        - `error` — system error
        - `done` — terminal event with conversation_id and tokens_used
      operationId: aiChat
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIChatRequest'}
            examples:
              newConversation:
                summary: Start new conversation
                value:
                  conversation_id: null
                  message: 下载 DeepSeek 最新发布的 V3 模型
                  context:
                    current_view: /
              continueWithConfirmation:
                summary: Reply with tool confirmation
                value:
                  conversation_id: 11111111-2222-3333-4444-555555555555
                  message: null
                  tool_confirmation:
                    call_id: call_ghi789
                    decision: approved
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE-formatted events; see description.
        '402':
          description: AI token quota exceeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                code: AI_QUOTA_EXCEEDED
                message: Tenant monthly AI token quota exhausted
                trace_id: c0ffee0123456789
                details:
                  metric: ai_tokens_month
                  current: 2000000
                  limit: 2000000
        '503':
          description: AI backend unavailable (LLM provider down)

  /ai/conversations:
    get:
      tags: [ai]
      summary: List my AI conversations
      operationId: listAIConversations
      parameters:
        - in: query
          name: archived
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AIConversation'}
                  next_cursor: {type: string, nullable: true}

  /ai/conversations/{conversationId}:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [ai]
      summary: Get conversation with full message history
      operationId: getAIConversation
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIConversationDetail'}
    delete:
      tags: [ai]
      summary: Archive (soft-delete) conversation
      operationId: archiveAIConversation
      responses:
        '204': {description: Archived}

  /ai/quota:
    get:
      tags: [ai]
      summary: AI token quota current state
      operationId: getAIQuota
      responses:
        '200':
          description: Quota
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIQuota'}

components:
  securitySchemes:
    # CODE-09 修复 (v2.0.16): 完整表达 modelpull 的 3 套鉴权
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC-issued system-JWT (HS256) or system_admin service token
    mtlsAuth:
      type: mutualTLS
      description: |
        OAS 3.1 native mTLS scheme. Used for executor → controller channel
        in addition to bearerAuth (executor JWT). Server validates client
        cert fingerprint against `executors.cert_fingerprint`.
    hmacBodySig:
      type: apiKey
      in: header
      name: X-Heartbeat-HMAC
      description: |
        HMAC-SHA256 of (request body + nonce + timestamp) using executor's
        enrollment_secret. Required for /executors/heartbeat in addition to
        mTLS + bearerAuth (defense in depth). Detail see 04 §2.2.4.

  parameters:
    TaskId:
      in: path
      name: taskId
      required: true
      schema: {type: string, format: uuid}
    StatusFilter:
      in: query
      name: status
      schema: {$ref: '#/components/schemas/TaskStatus'}
    Limit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      in: query
      name: cursor
      schema: {type: string, nullable: true}
    IdempotencyKey:
      in: header
      name: X-Idempotency-Key
      schema: {type: string, format: uuid}
      description: Client-generated UUID for safe retries

  responses:
    Unauthenticated:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Rate limited (returned for any token-bucket-throttled endpoint)
      headers:
        Retry-After:
          schema: {type: integer, description: seconds to wait before retry}
        X-RateLimit-Limit:
          schema: {type: integer, description: max requests in current window}
        X-RateLimit-Remaining:
          schema: {type: integer, description: remaining requests in current window}
        X-RateLimit-Reset:
          schema: {type: integer, description: unix timestamp when window resets}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ProblemDetail:
      description: RFC 7807 standard problem detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    PaginationHeaders:
      description: Standard pagination response headers
      headers:
        X-Total-Count:
          schema: {type: integer, nullable: true, description: total estimated count}
        Link:
          schema: {type: string, description: RFC 5988 Link header (next/prev)}

  schemas:
    # ===== Common =====
    ErrorResponse:
      type: object
      required: [code, message, trace_id]
      description: |
        Legacy error response (v2.0). New endpoints SHOULD use ProblemDetail
        (RFC 7807). Both schemas coexist for the v2.x release window;
        v3.0 may deprecate ErrorResponse.
      properties:
        code: {type: string}
        message: {type: string}
        trace_id: {type: string}
        details:
          type: object
          additionalProperties: true

    # CODE-10 修复 (v2.0.16): RFC 7807 standard problem detail; SDK generators
    # auto-map this to typed exceptions across languages
    ProblemDetail:
      type: object
      required: [type, title, status]
      description: RFC 7807 standard problem detail (application/problem+json)
      properties:
        type:
          type: string
          format: uri
          description: |
            URI identifying the problem type. e.g.
            https://docs.dlw.example.com/errors/quota-exceeded
          example: https://docs.dlw.example.com/errors/quota-exceeded
        title:
          type: string
          description: Short human-readable summary of the problem
          example: Tenant monthly bytes quota exceeded
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 429
        detail:
          type: string
          description: Specific human-readable explanation
        instance:
          type: string
          format: uri
          description: URI identifying this specific occurrence (often trace_id link)
        # modelpull-specific extensions (RFC 7807 allows additional members)
        code:
          type: string
          description: Machine-readable error code (same as ErrorResponse.code)
        trace_id:
          type: string
        retry_after_seconds:
          type: integer
          nullable: true

    # ===== Task =====
    TaskStatus:
      type: string
      enum: [pending, scheduling, downloading, verifying, completed, failed, cancelling, cancelled]

    SubtaskStatus:
      type: string
      enum:
        - pending
        - inherit
        - assigned
        - downloading
        - verifying_local
        - uploading
        - verifying_remote
        - verified
        - failed_permanent
        - paused_external
        - paused_disk_full
        - cancelling
        - cancelled

    SourceStrategy:
      type: string
      enum: [auto_balance, pin_huggingface, pin_modelscope, pin_hf_mirror, fastest_only, custom]

    FileFilter:
      type: string
      enum: [core_only, all, glob]

    DownloadTask:
      type: object
      required: [id, tenant_id, repo_id, revision, status, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: integer, format: int64}
        project_id: {type: integer, format: int64, nullable: true}
        owner_user_id: {type: integer, format: int64}
        repo_id:
          type: string
          pattern: '^[A-Za-z0-9_\-]{1,96}/[A-Za-z0-9_.\-]{1,96}$'
        revision: {type: string, pattern: '^[0-9a-f]{40}$'}
        storage_id: {type: integer, format: int64}
        path_template: {type: string, maxLength: 512}
        priority: {type: integer, minimum: 0, maximum: 3}
        status: {$ref: '#/components/schemas/TaskStatus'}
        source_strategy: {$ref: '#/components/schemas/SourceStrategy'}
        source_blacklist:
          type: array
          items: {type: string}
        is_simulation: {type: boolean}
        download_bytes_limit: {type: integer, format: int64, nullable: true}
        upgrade_from_revision: {type: string, nullable: true}
        progress: {$ref: '#/components/schemas/TaskProgress'}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        cancelled_at: {type: string, format: date-time, nullable: true}
        error_message: {type: string, nullable: true}
        trace_id: {type: string}

    TaskProgress:
      type: object
      properties:
        files_total: {type: integer}
        files_completed: {type: integer}
        bytes_total: {type: integer, format: int64}
        bytes_downloaded: {type: integer, format: int64}
        eta_seconds: {type: integer, nullable: true}
        sources_used:
          type: array
          items: {type: string}

    FileSubTask:
      type: object
      required: [id, task_id, filename, status]
      properties:
        id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        filename: {type: string, maxLength: 512}
        file_size: {type: integer, format: int64, nullable: true}
        expected_sha256: {type: string, pattern: '^[0-9a-f]{64}$', nullable: true}
        actual_sha256: {type: string, pattern: '^[0-9a-f]{64}$', nullable: true}
        status: {$ref: '#/components/schemas/SubtaskStatus'}
        inherit_from_key: {type: string, nullable: true, maxLength: 1024}
        executor_id: {type: string, nullable: true}
        executor_epoch: {type: integer, format: int64, nullable: true}
        assignment_token: {type: string, format: uuid, nullable: true}
        source_id: {type: string, nullable: true}
        chunks_total: {type: integer, nullable: true}
        chunks_completed: {type: integer}
        bytes_downloaded: {type: integer, format: int64}
        multipart_upload_id: {type: string, nullable: true}
        retry_count: {type: integer}
        last_error: {type: string, nullable: true}

    CreateTaskRequest:
      type: object
      required: [repo_id, revision]
      properties:
        repo_id:
          type: string
          pattern: '^[A-Za-z0-9_\-]{1,96}/[A-Za-z0-9_.\-]{1,96}$'
        revision:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Must be 40-char git sha; 'main' / branches not allowed
        storage_id: {type: integer, format: int64}
        path_template: {type: string, default: '{tenant}/{repo_id}/{revision}'}
        priority: {type: integer, minimum: 0, maximum: 3, default: 1}
        source_strategy: {$ref: '#/components/schemas/SourceStrategy'}
        source_blacklist:
          type: array
          items: {type: string}
        file_filter: {$ref: '#/components/schemas/FileFilter'}
        file_glob: {type: string, nullable: true}
        is_simulation: {type: boolean, default: false}
        upgrade_from_revision: {type: string, pattern: '^[0-9a-f]{40}$', nullable: true}
        download_bytes_limit: {type: integer, format: int64, nullable: true}
        trust_non_hf_sha256: {type: boolean, default: false}
        s3_direct_source:
          type: object
          nullable: true
          description: |
            Use S3-compatible bucket as direct source (v2.1; see 14 §6.1).
            Creates ad-hoc source for this task only; not added to global sources.yaml.
          required: [bucket, prefix, region]
          properties:
            bucket: {type: string, maxLength: 256}
            prefix: {type: string, maxLength: 1024}
            region: {type: string}
            credential_alias: {type: string, description: "alias from executor credential pool"}
            parallel_downloads: {type: integer, minimum: 1, maximum: 32, default: 8}

    TaskCreatedResponse:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/TaskStatus'}
        trace_id: {type: string}
        files_to_download: {type: integer}
        estimated_bytes: {type: integer, format: int64}
        speed_probe_eta_seconds: {type: integer}

    TaskListResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DownloadTask'}
        next_cursor: {type: string, nullable: true}
        total_estimated: {type: integer, nullable: true}

    SourceAllocation:
      type: object
      properties:
        task_id: {type: string, format: uuid}
        sources_used:
          type: array
          items:
            type: object
            properties:
              source_id: {type: string}
              bytes_assigned: {type: integer, format: int64}
              percent: {type: number}
              measured_speed_bps: {type: number}
        chunk_level_routing:
          type: array
          items:
            type: object
            properties:
              filename: {type: string}
              chunks:
                type: array
                items:
                  type: object
                  properties:
                    chunk_index: {type: integer}
                    byte_start: {type: integer, format: int64}
                    byte_end: {type: integer, format: int64}
                    source_id: {type: string}
                    status: {type: string}
                    bytes_done: {type: integer, format: int64}

    TaskEvent:
      type: object
      properties:
        ts: {type: string, format: date-time}
        type: {type: string}
        message: {type: string}
        details:
          type: object
          additionalProperties: true

    SubtaskChunkReport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [subtask_id, filename, status, bytes_downloaded, is_chunked, chunks_completed, chunks]
            properties:
              subtask_id: {type: string, format: uuid}
              filename: {type: string}
              file_size: {type: integer, format: int64, nullable: true}
              status: {type: string}
              bytes_downloaded: {type: integer, format: int64}
              is_chunked: {type: boolean}
              chunks_total: {type: integer, nullable: true}
              chunks_completed: {type: integer}
              chunks:
                type: array
                items:
                  type: object
                  required: [chunk_index, byte_start, byte_end, source_id, status, bytes_done]
                  properties:
                    chunk_index: {type: integer}
                    byte_start: {type: integer, format: int64}
                    byte_end: {type: integer, format: int64}
                    source_id: {type: string}
                    status: {type: string}
                    bytes_done: {type: integer, format: int64}

    ParticipatingExecutors:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [executor_id, assigned_subtasks, active_subtasks, bytes_downloaded]
            properties:
              executor_id: {type: string}
              executor_status: {type: string, nullable: true}
              health_score: {type: integer, nullable: true}
              last_heartbeat_at: {type: string, format: date-time, nullable: true}
              assigned_subtasks: {type: integer}
              active_subtasks: {type: integer}
              bytes_downloaded: {type: integer, format: int64}

    # ===== Models =====
    ModelSummary:
      type: object
      properties:
        repo_id: {type: string}
        downloads: {type: integer}
        likes: {type: integer}
        last_modified: {type: string, format: date-time}
        pipeline_tag: {type: string, nullable: true}
        is_gated: {type: boolean}

    ModelInfo:
      type: object
      properties:
        repo_id: {type: string}
        revision: {type: string}
        license: {type: string, nullable: true}
        is_gated: {type: boolean}
        files:
          type: array
          items:
            type: object
            properties:
              filename: {type: string}
              size: {type: integer, format: int64, nullable: true}
              sha256: {type: string, nullable: true}
              available_on:
                type: array
                items: {type: string}

    # ===== Executor =====
    ExecutorRegisterRequest:
      type: object
      required: [host_id, executor_id_proposal, capabilities, client_csr_pem]
      properties:
        host_id: {type: string}
        executor_id_proposal: {type: string}
        tenant_id: {type: integer, format: int64, nullable: true}
        parent_executor_id: {type: string, nullable: true}
        display_name: {type: string, maxLength: 128, nullable: true}
        location: {type: string, maxLength: 128, nullable: true}
        tags:
          type: array
          items: {type: string}
        capabilities:
          type: object
          properties:
            nic_speed_gbps: {type: integer}
            regions:
              type: array
              items: {type: string}
            storage_backends:
              type: array
              items: {type: integer}
        credential_pool_summary:
          type: object
          description: |
            Aliases only; secrets stay on executor (invariant 30, v2.1).
            See 14 §3.3 for full protocol.
          properties:
            gateway_aliases:
              type: array
              items: {type: string}
            hf_token_aliases:
              type: array
              items: {type: string}
            s3_credential_aliases:
              type: array
              items:
                type: object
                properties:
                  alias: {type: string}
                  source_id: {type: string}
        client_csr_pem:
          type: string
          description: X.509 CSR in PEM format

    ExecutorRegisterResponse:
      type: object
      properties:
        executor_id: {type: string}
        epoch: {type: integer, format: int64}
        client_cert_pem: {type: string, description: PEM-encoded X.509 client certificate}
        ca_chain:
          type: array
          items: {type: string}
          description: CA certificate chain PEM strings
        executor_jwt: {type: string}
        hmac_seed_hex: {type: string, description: 256-bit hex HMAC seed for heartbeat signatures}
        cert_renew_in_seconds: {type: integer, description: Seconds until certificate renewal recommended}
        jwt_renew_in_seconds: {type: integer, description: Seconds until JWT renewal recommended}
        jwt_signing_alg: {type: string, const: EdDSA}
        next_renew_in_seconds: {type: integer, description: "Deprecated: use cert_renew_in_seconds"}

    HeartbeatRequest:
      type: object
      required: [executor_id, epoch, host_id, timestamp]
      properties:
        executor_id: {type: string}
        epoch: {type: integer, format: int64}
        host_id: {type: string}
        parent_executor_id: {type: string, nullable: true}
        timestamp: {type: string, format: date-time}
        uptime_seconds: {type: integer}
        system: {$ref: '#/components/schemas/ExecutorSystemReport'}
        source_health:
          type: object
          additionalProperties: {$ref: '#/components/schemas/SourceHealthReport'}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/SubtaskProgressReport'}
        completed_subtasks:
          type: array
          items: {$ref: '#/components/schemas/SubtaskCompleteRequest'}
        failed_subtasks:
          type: array
          items: {$ref: '#/components/schemas/SubtaskFailureReport'}
        rate_limit_probe_results:
          type: array
          description: v2.1; results from probing performed since last heartbeat
          items:
            type: object
            properties:
              target_host: {type: string}
              executor_ip_class: {type: string, nullable: true}
              user_account_alias: {type: string, nullable: true}
              connection_limited: {type: boolean}
              ip_limited: {type: boolean}
              user_limited: {type: boolean}
              per_conn_speed_bps: {type: integer, format: int64, nullable: true}
              per_ip_speed_bps: {type: integer, format: int64, nullable: true}
              per_user_speed_bps: {type: integer, format: int64, nullable: true}
              confidence: {type: number, minimum: 0, maximum: 1}
              measurement_started_at: {type: string, format: date-time}
              bytes_consumed_for_probe: {type: integer, format: int64}
        credential_change_event:
          type: object
          nullable: true
          description: v2.1; reports SIGHUP credential reload (drain phase per DIST-V21-07)
          properties:
            phase: {type: string, enum: [pending, committed]}
            added_aliases:
              type: array
              items: {type: string}
            removed_aliases:
              type: array
              items: {type: string}

    ExecutorSystemReport:
      type: object
      properties:
        nic_speed_gbps: {type: integer}
        nic_utilization_percent: {type: number}
        disk_total_gb: {type: integer, format: int64}
        disk_free_gb: {type: integer, format: int64}
        parts_dir_bytes: {type: integer, format: int64}
        memory_used_percent: {type: number}
        load_avg_1min: {type: number}
        active_threads: {type: integer}
        running_subtasks: {type: integer}
        multi_executor:
          type: object
          properties:
            siblings_on_host:
              type: array
              items: {type: string}
            host_total_running: {type: integer}

    SourceHealthReport:
      type: object
      properties:
        reachable: {type: boolean}
        rtt_ms: {type: integer, nullable: true}
        last_5xx_ago_s: {type: integer, nullable: true}

    SubtaskProgressReport:
      type: object
      required: [subtask_id, task_id, executor_epoch, assignment_token]
      properties:
        subtask_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        executor_epoch: {type: integer, format: int64}
        assignment_token: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/SubtaskStatus'}
        bytes_downloaded: {type: integer, format: int64}
        bytes_total: {type: integer, format: int64, nullable: true}
        chunks_total: {type: integer, nullable: true}
        chunks_completed: {type: integer}
        active_threads: {type: integer}
        current_speed_bytes_per_sec: {type: number}
        speed_window_seconds: {type: integer}
        eta_seconds: {type: integer, nullable: true}
        source_id: {type: string}
        remote_etag_seen: {type: string, nullable: true}

    SubtaskCompleteRequest:
      type: object
      required: [actual_sha256, actual_size]
      properties:
        actual_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        actual_size: {type: integer, format: int64}
        remote_storage_uri: {type: string}
        remote_etag: {type: string}
        remote_sha256_via_checksum: {type: string, nullable: true}
        duration_seconds: {type: integer}
        sources_used:
          type: array
          items: {type: string}
        bytes_per_source:
          type: object
          additionalProperties: {type: integer, format: int64}

    SubtaskFailureReport:
      type: object
      required: [subtask_id, error_code, retryable]
      properties:
        subtask_id: {type: string, format: uuid}
        error_code: {type: string}
        error_message: {type: string}
        retryable: {type: boolean}
        attempted_sources:
          type: array
          items: {type: string}

    HeartbeatResponse:
      type: object
      required: [server_timestamp, epoch_check]
      properties:
        server_timestamp: {type: string, format: date-time}
        epoch_check: {type: string, enum: [ok, mismatch]}
        next_heartbeat_in_seconds: {type: integer, default: 10}
        config_version: {type: integer}
        policies_to_apply:
          type: object
          properties:
            max_concurrent_per_executor: {type: integer}
            global_speed_limit_bytes_per_sec: {type: integer, nullable: true}
            source_blacklist_global:
              type: array
              items: {type: string}
        new_assignments:
          type: array
          items: {$ref: '#/components/schemas/SubtaskAssignment'}
        cancellations:
          type: array
          items:
            type: object
            properties:
              subtask_id: {type: string, format: uuid}
              reason: {type: string}
        reassignments:
          type: array
          items:
            type: object
            properties:
              subtask_id: {type: string, format: uuid}
              chunks_to_release:
                type: array
                items: {type: integer}
        speed_probe_request:
          type: object
          nullable: true
          properties:
            task_id: {type: string, format: uuid}
            sources:
              type: array
              items: {type: string}
            probe_size_mb: {type: integer}
            deadline_at: {type: string, format: date-time}

    SubtaskAssignment:
      type: object
      required: [subtask_id, task_id, filename, expected_size, source_id, executor_epoch, target_executor_epoch, assignment_token, deadline_at]
      properties:
        subtask_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        filename: {type: string}
        expected_size: {type: integer, format: int64}
        expected_sha256: {type: string, nullable: true}
        source_id: {type: string}
        alternate_sources:
          type: array
          items: {type: string}
        executor_epoch:
          type: integer
          format: int64
          description: deprecated alias for target_executor_epoch
        target_executor_epoch:
          type: integer
          format: int64
          description: |
            v2.1 (DIST-V21-03 fence): executor must verify push.target_executor_epoch == self.epoch
            before applying. Mismatch → close ws and reconnect.
        optimization_generation:
          type: integer
          format: int64
          description: v2.1 (DIST-V21-04 fence) — must echo back in part complete reports
        assignment_token: {type: string, format: uuid}
        credential_aliases:
          type: object
          description: v2.1 (14 §3.4) — controller dispatches which alias to use
          properties:
            gateway_alias: {type: string, nullable: true}
            hf_token_alias: {type: string, nullable: true}
            s3_credential_alias: {type: string, nullable: true}
        deadline_at: {type: string, format: date-time}
        chunk_plan:
          type: array
          nullable: true
          items:
            type: object
            properties:
              chunk_index: {type: integer}
              byte_start: {type: integer, format: int64}
              byte_end: {type: integer, format: int64}
              source_id: {type: string}
        storage_target:
          type: object
          properties:
            backend: {type: string, enum: [s3, obs, minio, nfs, local]}
            endpoint: {type: string}
            bucket: {type: string}
            key_prefix: {type: string}
            sts_credentials:
              type: object
              properties:
                access_key_id: {type: string}
                secret_access_key: {type: string}
                session_token: {type: string}
                expires_at: {type: string, format: date-time}

    # ===== Tenant / Quota / Audit =====
    Tenant:
      type: object
      properties:
        id: {type: integer, format: int64}
        slug: {type: string}
        display_name: {type: string}
        quota_bytes_month: {type: integer, format: int64}
        quota_concurrent: {type: integer}
        quota_storage_gb: {type: integer, format: int64}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}

    QuotaCurrent:
      type: object
      properties:
        tenant_id: {type: integer, format: int64}
        bytes_used_month: {type: integer, format: int64}
        bytes_quota_month: {type: integer, format: int64}
        storage_gb_used: {type: integer, format: int64}
        storage_gb_quota: {type: integer, format: int64}
        concurrent_tasks: {type: integer}
        concurrent_quota: {type: integer}
        remaining_days_in_billing_period: {type: integer}
        forecast_month_end_usage: {type: integer, format: int64, nullable: true}

    QuotaUsage:
      type: object
      properties:
        period:
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
        items:
          type: array
          items:
            type: object
            properties:
              group_key: {type: string}
              metrics:
                type: object
                additionalProperties: {type: integer, format: int64}

    AuditEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        occurred_at: {type: string, format: date-time}
        tenant_id: {type: integer, format: int64, nullable: true}
        actor_user_id: {type: integer, format: int64, nullable: true}
        actor_ip: {type: string}
        action: {type: string}
        resource_type: {type: string}
        resource_id: {type: string, nullable: true}
        outcome: {type: string, enum: [success, denied, error]}
        payload:
          type: object
          additionalProperties: true
        trace_id: {type: string}
        prev_hash: {type: string, nullable: true}
        self_hash: {type: string}

    # ===== Storage =====
    StorageBackend:
      type: object
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64, nullable: true}
        name: {type: string}
        backend_type: {type: string, enum: [s3, obs, minio, nfs, local]}
        region: {type: string, nullable: true}
        is_default: {type: boolean}

    CreateStorageBackendRequest:
      type: object
      required: [name, backend_type, config]
      properties:
        name: {type: string, maxLength: 128}
        backend_type: {type: string, enum: [s3, obs, minio, nfs, local]}
        region: {type: string}
        is_default: {type: boolean}
        config:
          type: object
          description: |
            Backend-specific config; encrypted at rest with envelope encryption.
            For s3: {endpoint, bucket, role_arn, access_key_id, secret_access_key}
            For nfs: {mount_path}
          additionalProperties: true

    # ===== Webhook =====
    WebhookConfig:
      type: object
      properties:
        id: {type: integer, format: int64}
        url: {type: string, format: uri}
        events:
          type: array
          items: {type: string}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url: {type: string, format: uri}
        events:
          type: array
          items: {type: string, enum: ['*', task.completed, task.failed, task.cancelled, quota.exceeded]}
        secret: {type: string, description: "HMAC secret; envelope-encrypted at rest"}

    # ===== AI Copilot (v2.1) =====
    AIChatRequest:
      type: object
      properties:
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: null to start a new conversation
        message:
          type: string
          nullable: true
          maxLength: 32768
          description: User message text. May be null if only sending tool_confirmation.
        context:
          type: object
          description: UI context for grounding (current page, selected entity)
          properties:
            current_view: {type: string}
            selected_task_id: {type: string, format: uuid, nullable: true}
            current_filter:
              type: object
              additionalProperties: true
        tool_confirmation:
          type: object
          nullable: true
          required: [call_id, decision]
          properties:
            call_id: {type: string}
            decision:
              type: string
              enum: [approved, rejected, modified]
            modified_input:
              type: object
              nullable: true
              description: Patched input when decision=modified
              additionalProperties: true

    AIConversation:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        last_message_at: {type: string, format: date-time}
        archived: {type: boolean}
        backend:
          type: string
          enum: [anthropic_sdk, claude_code, opencode]
        model_name: {type: string}
        message_count: {type: integer}
        tokens_total: {type: integer}

    AIConversationDetail:
      allOf:
        - $ref: '#/components/schemas/AIConversation'
        - type: object
          properties:
            messages:
              type: array
              items: {$ref: '#/components/schemas/AIMessage'}

    AIMessage:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant, system]}
        content:
          type: object
          description: Rich content; may include text, tool_calls, tool_results
          additionalProperties: true
        tokens_input: {type: integer}
        tokens_output: {type: integer}
        created_at: {type: string, format: date-time}
        tool_calls:
          type: array
          items: {$ref: '#/components/schemas/AIToolCall'}

    AIToolCall:
      type: object
      properties:
        id: {type: string, format: uuid}
        tool_name: {type: string}
        input: {type: object, additionalProperties: true}
        output: {type: object, nullable: true, additionalProperties: true}
        error_code: {type: string, nullable: true}
        requires_confirmation: {type: boolean}
        confirmation_decision:
          type: string
          enum: [approved, rejected, modified]
          nullable: true
        confirmed_by_user_id: {type: integer, format: int64, nullable: true}
        confirmation_at: {type: string, format: date-time, nullable: true}
        duration_ms: {type: integer, nullable: true}
        audit_log_id: {type: integer, format: int64, nullable: true}
        created_at: {type: string, format: date-time}

    AIQuota:
      type: object
      properties:
        tenant_id: {type: integer, format: int64}
        ai_tokens_used_month: {type: integer, format: int64}
        ai_tokens_quota_month: {type: integer, format: int64}
        ai_cost_usd_cents_month: {type: integer}
        active_conversations: {type: integer}
        max_concurrent_conversations: {type: integer}

    # ===== Executor v1 schemas (Phase 2 W1) =====

    ExecutorRead:
      type: object
      required: [id, status, health_score, epoch]
      description: |
        Returned by /join, /heartbeat, and the browser-facing /executors list.
        UI-SP3 extends this with optional/nullable fields needed by the
        Executors page; pre-existing consumers (mTLS /join, /heartbeat) are
        unaffected because all new fields are nullable / optional.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [joining, healthy, degraded, suspect, faulty]
          description: Executor lifecycle state (W2a §6).
        health_score:
          type: integer
          minimum: 0
          maximum: 100
        epoch:
          type: integer
          minimum: 0
          description: Current epoch (fence token). Increments on every /join.
        host_id:
          type: string
          nullable: true
          description: Physical host identifier (groups co-located executors).
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: Owning tenant; null for shared-infra executors.
        last_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        nic_speed_gbps:
          type: integer
          nullable: true
        disk_free_gb:
          type: integer
          format: int64
          nullable: true
        disk_total_gb:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    ExecutorListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ExecutorRead'}

    StorageConfig:
      type: object
      required: [bucket]
      properties:
        bucket:
          type: string
        region:
          type: string
          default: us-east-1
        endpoint_url:
          type: string
          nullable: true
        key_prefix:
          type: string
          default: ""

    SubTaskRead:
      type: object
      required: [id, task_id, filename, status]
      description: Subtask detail returned in assignment payload and GET subtask detail.
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 512
        file_size:
          type: integer
          format: int64
          nullable: true
        expected_sha256:
          type: string
          nullable: true
        status:
          type: string
        s3_key:
          type: string
          nullable: true
          maxLength: 1024

    AssignmentResponse:
      type: object
      required: [assigned]
      description: Response from POST /poll — either a subtask assignment or empty.
      properties:
        assigned:
          type: boolean
        subtask:
          $ref: '#/components/schemas/SubTaskRead'
          nullable: true
        assignment_token:
          type: string
          format: uuid
          nullable: true
        repo_id:
          type: string
          nullable: true
        revision:
          type: string
          nullable: true
        storage_config:
          $ref: '#/components/schemas/StorageConfig'

    SubTaskReport:
      type: object
      required: [status]
      description: Request body for POST /subtasks/{subtaskId}/report — executor reports outcome.
      properties:
        status:
          type: string
          enum: [succeeded, failed, paused_disk_full, paused_external]
          description: Subtask completion status reported by executor.
        assignment_token:
          type: string
          format: uuid
          nullable: true
          description: Token from /poll AssignmentResponse — verified against stored value.
        actual_sha256:
          type: string
          minLength: 64
          maxLength: 64
          nullable: true
        bytes_downloaded:
          type: integer
          format: int64
          minimum: 0
          default: 0
        s3_key:
          type: string
          nullable: true
          maxLength: 1024
        error:
          type: string
          nullable: true
          maxLength: 2048
        executor_epoch:
          type: integer
          nullable: true
          description: Executor's current epoch (fence). Must match subtask.executor_epoch.

    # ===== SP1 Multi-tenancy error schemas =====
    RbacDenied:
      type: object
      description: Returned when RBAC check denies the operation.
      properties:
        code:
          type: string
          example: RBAC_DENIED

    QuotaExceeded:
      type: object
      description: Returned when a tenant quota limit is reached.
      properties:
        code:
          type: string
          example: QUOTA_EXCEEDED
        metric:
          type: string
          example: concurrent_tasks

    TenantUnresolved:
      type: object
      description: Returned when no tenant rule matches the authenticated identity.
      properties:
        code:
          type: string
          example: TENANT_UNRESOLVED
        message:
          type: string

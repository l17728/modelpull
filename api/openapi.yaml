        '401':
          description: Epoch mismatch (stale executor) or bearer token invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          code:
                            type: string
                            enum: [EPOCH_MISMATCH]
                          expected:
                            type: integer
                          got:
                            type: integer
        '409':

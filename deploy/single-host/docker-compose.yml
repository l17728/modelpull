# modelpull v2.1 single-host docker compose.
#
# What this brings up on one VM:
#   - postgres-18           PG with the dlw database
#   - minio                 S3-compatible storage backend
#   - controller            FastAPI app on 127.0.0.1:8001 (loopback only — front it with your existing HTTPS reverse proxy)
#   - executor-1            first download worker
#   - executor-2            second download worker
#   - frontend              Vite preview server on 127.0.0.1:5173 (also loopback; reverse-proxy if you want browser access)
#   - migrate (one-shot)    runs alembic upgrade head before controller starts
#
# Usage:
#   1) cp .env.example .env  and fill in
#   2) ./bootstrap.sh         (generates CA + JWT signing key + enrollment token; idempotent)
#   3) docker compose up -d --build
#   4) docker compose logs -f controller    (watch for "controller_state=active")
#
# The controller binds ONLY to 127.0.0.1 — your existing HTTPS reverse
# proxy (nginx / caddy / cloudflare-tunnel / etc.) forwards :443 →
# 127.0.0.1:8001 so the controller is never directly exposed.

# --------------------------------------------------------------------------
# Logging defaults — applied per-service via YAML anchor.
#
# json-file driver with rotation: each container caps at 7 × 100MB = 700MB
# on disk before old logs roll off. `docker compose logs` keeps working
# unchanged; in addition, we bind-mount /var/log/modelpull on each service
# so the user can `tail -f` files directly without going through docker.
#
# Concrete log paths (persisted on host, see deploy.sh which creates them):
#   /opt/modelpull/logs/controller.log
#   /opt/modelpull/logs/executor-1.log
#   /opt/modelpull/logs/executor-2.log
#   /opt/modelpull/logs/postgres.log
#   /opt/modelpull/logs/minio.log
#   /opt/modelpull/logs/frontend.log
#
# Set DLW_LOG_LEVEL=DEBUG in .env for verbose diagnostics.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "7"
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:18-alpine
    container_name: dlw-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dlw
    volumes:
      # PostgreSQL 18 changed its volume convention — data lives under
      # /var/lib/postgresql (major-version subdir below). Mounting only
      # /var/lib/postgresql/data triggers a startup-time refusal on
      # PG 18+ (see docker-library/postgres#1259).
      - dlw-pgdata:/var/lib/postgresql
      - ./logs:/var/log/dlw     # for the tail script below
    # NOT exposed to host network — only the controller + migrate
    # containers reach it through the internal docker network.
    command: >
      postgres
        -c log_destination=stderr
        -c logging_collector=off
        -c log_min_messages=info
        -c log_min_error_statement=error
        -c log_connections=on
        -c log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dlw"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: dlw-minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - dlw-miniodata:/data
    ports:
      # MinIO console on 9001 — bound to loopback; reverse-proxy or use
      # an SSH tunnel if you need to manage buckets via browser.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.controller
    container_name: dlw-migrate
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DLW_DB_HOST: postgres
      DLW_DB_PORT: "5432"
      DLW_DB_USER: postgres
      DLW_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DLW_DB_NAME: dlw
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  controller:
    build:
      context: ../..
      dockerfile: Dockerfile.controller
    container_name: dlw-controller
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DLW_DB_HOST: postgres
      DLW_DB_PORT: "5432"
      DLW_DB_USER: postgres
      DLW_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DLW_DB_NAME: dlw
      DLW_LOG_LEVEL: ${DLW_LOG_LEVEL:-INFO}
      # Auth — bootstrap.sh generates these into .env
      DLW_AUTH_DEV_MODE: "${DLW_AUTH_DEV_MODE:-false}"
      DLW_SYSTEM_JWT_SECRET: ${DLW_SYSTEM_JWT_SECRET}
      DLW_ADMIN_USERNAME: ${DLW_ADMIN_USERNAME:-admin}
      DLW_ADMIN_INITIAL_PASSWORD: ${DLW_ADMIN_INITIAL_PASSWORD}
      DLW_ENROLLMENT_TOKEN: ${DLW_ENROLLMENT_TOKEN}
      DLW_CONTROLLER_HOSTNAME: dlw-controller
      DLW_CA_DIR: /app/.ca
      # MinIO as the default S3-compatible storage backend
      DLW_HF_ENDPOINT: https://huggingface.co
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - dlw-ca:/app/.ca
      # Host-side persistent logs — controller python logging tees here
      # via the entrypoint wrapper. See bootstrap.sh for the wrapper.
      - ./logs:/var/log/dlw
    # Wrap uvicorn so its stdout/stderr ALSO lands in a host-visible file.
    # `script` gives us a real PTY so uvicorn's color codes don't break
    # `tail -f`; if `script` isn't installed (slim image), fall back to tee.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/log/dlw
        exec uvicorn dlw.main:app --host 0.0.0.0 --port 8001 \
             2>&1 | tee -a /var/log/dlw/controller.log
    ports:
      # Loopback ONLY — front this with your existing HTTPS reverse proxy.
      - "127.0.0.1:8001:8001"
    healthcheck:
      # The controller's liveness endpoint is /health/live (Phase 1
      # design, see api/health.py). Earlier drafts of this compose file
      # used /healthz which returns 404.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  executor-1:
    build:
      context: ../..
      dockerfile: Dockerfile.executor
    container_name: dlw-executor-1
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      controller:
        condition: service_healthy
    environment:
      DLW_EXECUTOR_ID: catown-host-1-worker-1
      DLW_EXECUTOR_HOST_ID: catown-host-1
      DLW_EXECUTOR_CONTROLLER_URL: http://controller:8001
      DLW_EXECUTOR_BEARER_TOKEN: ${DLW_ENROLLMENT_TOKEN}
      DLW_EXECUTOR_ENROLLMENT_TOKEN: ${DLW_ENROLLMENT_TOKEN}
      DLW_EXECUTOR_DOWNLOAD_DIR: /downloads
      DLW_EXECUTOR_PARTS_DIR_PATH: /parts
      DLW_EXECUTOR_REGION: local
      DLW_EXECUTOR_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dlw-executor-1-downloads:/downloads
      - dlw-executor-1-parts:/parts
      - ./logs:/var/log/dlw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/log/dlw
        exec dlw-executor --log-level ${DLW_LOG_LEVEL:-INFO} \
             2>&1 | tee -a /var/log/dlw/executor-1.log

  executor-2:
    build:
      context: ../..
      dockerfile: Dockerfile.executor
    container_name: dlw-executor-2
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      controller:
        condition: service_healthy
    environment:
      DLW_EXECUTOR_ID: catown-host-1-worker-2
      DLW_EXECUTOR_HOST_ID: catown-host-1
      DLW_EXECUTOR_CONTROLLER_URL: http://controller:8001
      DLW_EXECUTOR_BEARER_TOKEN: ${DLW_ENROLLMENT_TOKEN}
      DLW_EXECUTOR_ENROLLMENT_TOKEN: ${DLW_ENROLLMENT_TOKEN}
      DLW_EXECUTOR_DOWNLOAD_DIR: /downloads
      DLW_EXECUTOR_PARTS_DIR_PATH: /parts
      DLW_EXECUTOR_REGION: local
      DLW_EXECUTOR_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dlw-executor-2-downloads:/downloads
      - dlw-executor-2-parts:/parts
      - ./logs:/var/log/dlw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/log/dlw
        exec dlw-executor --log-level ${DLW_LOG_LEVEL:-INFO} \
             2>&1 | tee -a /var/log/dlw/executor-2.log

  frontend:
    image: node:20-alpine
    container_name: dlw-frontend
    restart: unless-stopped
    logging: *default-logging
    working_dir: /app
    volumes:
      - ../../frontend:/app
      - ./logs:/var/log/dlw
    environment:
      # npm registry mirror — China-region VMs can't reach
      # registry.npmjs.org reliably. Same rationale as the python pip
      # mirror baked into Dockerfile.controller/.executor.
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      # vite preview reads this and proxies /api + /health + /metrics
      # to the controller via docker DNS. Single browser origin (5173)
      # serves both UI and API → no CORS, no public controller port.
      DLW_API_PROXY: http://controller:8001
    command:
      - sh
      - -c
      - |
        mkdir -p /var/log/dlw
        corepack enable pnpm
        # NPM_CONFIG_REGISTRY is set above; pnpm reads it directly.
        pnpm install --frozen-lockfile
        # Build only if dist is empty — vite/rollup needs ≥ 1 GB free
        # memory and OOMs on small VMs when other containers are also
        # running. Ship the host's pre-built dist via bind mount or scp
        # to skip remote rebuild after restarts. Use
        # NODE_OPTIONS=--max-old-space-size=768 to constrain peak mem
        # when remote build is unavoidable.
        if [ ! -f /app/dist/index.html ]; then
          echo "[frontend] dist/index.html missing → building (may OOM on <2GB VMs)"
          NODE_OPTIONS="--max-old-space-size=768" pnpm build
        else
          echo "[frontend] dist/ already present — skipping rebuild"
        fi
        exec pnpm preview --host 0.0.0.0 --port 5173 \
             2>&1 | tee -a /var/log/dlw/frontend.log
    ports:
      # Public 5173: bound to 0.0.0.0 so it's reachable on the host's
      # external IP. Open this port in your cloud firewall. The
      # controller itself stays loopback — vite preview proxies /api
      # so the controller never needs to be exposed externally.
      - "5173:5173"
    depends_on:
      controller:
        condition: service_healthy

volumes:
  dlw-pgdata:
  dlw-miniodata:
  dlw-ca:
  dlw-executor-1-downloads:
  dlw-executor-1-parts:
  dlw-executor-2-downloads:
  dlw-executor-2-parts:

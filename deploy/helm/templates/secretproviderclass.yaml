{{- if .Values.controller.secrets.vault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "dlw.fullname" . }}-vault
  namespace: {{ .Release.Namespace }}
spec:
  provider: vault
  parameters:
    roleName: {{ required ".Values.controller.secrets.vault.role required" .Values.controller.secrets.vault.role | quote }}
    # CODE-05 修复 (v2.0.12): vaultAddress 改为 helm value，不再硬编码占位
    vaultAddress: {{ required ".Values.controller.secrets.vault.address required (e.g. https://vault.corp.example.com:8200)" .Values.controller.secrets.vault.address | quote }}
    {{- with .Values.controller.secrets.vault.tlsServerName }}
    vaultTLSServerName: {{ . | quote }}
    {{- end }}
    {{- with .Values.controller.secrets.vault.caCertPath }}
    vaultCACertPath: {{ . | quote }}
    {{- end }}
    objects: |
      - objectName: hf_token_primary
        secretPath: "secret/data/dlw/hf_token"
        secretKey: primary
      - objectName: hf_token_secondary
        secretPath: "secret/data/dlw/hf_token"
        secretKey: secondary
      - objectName: db_password
        secretPath: "secret/data/dlw/db"
        secretKey: password
      - objectName: kms_key_id
        secretPath: "secret/data/dlw/kms"
        secretKey: key_id
      - objectName: oidc_client_secret
        secretPath: "secret/data/dlw/oidc"
        secretKey: client_secret
{{- end }}

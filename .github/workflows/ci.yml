name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # OpenAPI: lint + spectral rules + diff against base
  # ============================================================
  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: '20'}

      # CODE-17 修复 (v2.0.16): 缓存 ~/.npm 全局缓存（不依赖 setup-node 的 cache=npm，
      # 因为我们没有 lock 文件；直接缓存 npm 下载目录）
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-spectral6-swagger-cli
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install spectral + swagger-cli (cached if hit)
        run: |
          npm install -g @stoplight/spectral-cli@6 @apidevtools/swagger-cli

      - name: Create spectral ruleset
        run: |
          cat > .spectral.yaml <<'EOF'
          extends: spectral:oas
          rules:
            oas3-unused-component: warn
            operation-tag-defined: warn
          EOF

      - name: Validate OpenAPI syntax
        run: spectral lint api/openapi.yaml --fail-severity=error

      - name: Validate with swagger-cli (catches $ref errors)
        run: swagger-cli validate api/openapi.yaml

  # ============================================================
  # Helm: lint + template + values schema
  # ============================================================
  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with: {version: v3.14.0}

      - name: helm dependency update
        run: helm dependency update deploy/helm/ || true

      - name: helm lint
        run: helm lint deploy/helm/

      - name: helm template (default values)
        run: helm template dlw deploy/helm/ --debug > /tmp/rendered.yaml

      - name: kubeconform (validate against k8s schemas)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.29.0 /tmp/rendered.yaml

  # ============================================================
  # Shell: shellcheck on runbook scripts
  # ============================================================
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./deploy/runbooks/scripts
          severity: warning
          # SC2086: word splitting; SC1091: source resolution; SC2034: unused vars - 已知 false positive
          ignore_paths: ""

  # ============================================================
  # Markdown: lint + link check
  # ============================================================
  markdown:
    name: Markdown lint + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: 'docs/v2.0/*.md README.md CONTRIBUTING.md'
          # Uses .markdownlint.json at repo root

      - name: Link check (markdown internal links only)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --offline --no-progress 'docs/v2.0/**/*.md' 'README.md'
          fail: true

  # ============================================================
  # YAML: yamllint
  # ============================================================
  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: deploy/ api/
          config_file: .yamllint.yml

  # ============================================================
  # Security: gitleaks (no secrets in repo)
  # ============================================================
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JSON: Grafana dashboards must be valid JSON
  # ============================================================
  json:
    name: JSON validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Grafana JSON
        run: |
          for f in deploy/grafana/*.json; do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))"
          done

  # ============================================================
  # Invariant + cross-ref lint (v2.1, ENT-QA-17 / X-DOC-16)
  # Ensures invariant numbers in 01 §7 stay consistent with body declarations
  # and cross-doc § references resolve.
  # ============================================================
  invariant_lint:
    name: Invariant + cross-ref lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      # CODE-17 修复 (v2.0.16): 缓存 pip 下载目录（无 requirements.txt 时不能用 setup-python 的 cache=pip）
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-pytest

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests for lint_invariants.py (CODE-08, v2.0.13)
        run: python -m pytest tools/test_lint_invariants.py -v

      - name: Run invariant lint
        run: python tools/lint_invariants.py

      - name: Run invariant lint (strict — fail on cross-ref drift)
        # 暂时仅作 INFO；待 cross-ref 全部清理后改为 strict 阻断
        continue-on-error: true
        run: python tools/lint_invariants.py --strict

  # ============================================================
  # Python: pytest with PG service container (Phase 1 foundation)
  # ============================================================
  pytest:
    name: pytest (Phase 1 foundation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DLW_TEST_PG_HOST: localhost
      DLW_TEST_PG_PORT: "5432"
      DLW_TEST_PG_USER: postgres
      DLW_TEST_PG_PASSWORD: postgres
      DLW_TEST_PG_ADMIN_DB: postgres
      DLW_DB_HOST: localhost
      DLW_DB_PORT: "5432"
      DLW_DB_USER: postgres
      DLW_DB_PASSWORD: postgres
      DLW_DB_NAME: dlw
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with: {version: '0.5.0'}

      - name: Install deps via uv
        run: uv sync --all-groups

      - name: Create dlw database (for alembic + health-ready test)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE dlw"

      - name: Run pytest with coverage
        run: |
          uv run pytest tests/ \
            --cov=src/dlw \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ============================================================
  # Aggregate gate
  # ============================================================
  ci:
    name: CI Status
    needs: [openapi, helm, shellcheck, markdown, yamllint, security, json, invariant_lint, pytest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed ✓"
